#user  nobody;
worker_processes  auto;

error_log  logs/error.log  warn;

#pid        logs/nginx.pid;

include  nginx.main.inc;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    include       nginx.vhost.inc;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent"';

    access_log  logs/access.log  main;

    sendfile        on;
    #tcp_nopush     on;
    gzip            on;

    server_tokens   off;

    # Docker 內建 DNS resolver（127.0.0.11）適用於所有 Docker network。
    # K8s 環境請在 conf/local/nginx.http.resolver.inc 覆寫為 cluster DNS。
    resolver  127.0.0.11  valid=30s ipv6=off;

    keepalive_timeout  65;

    lua_code_cache  on;
    # lua_ssl_verify_depth 5;
    # lua_ssl_trusted_certificate "ssl/ca-bundle.crt";

    # load local config
    include  'local/nginx.http*.inc';
}